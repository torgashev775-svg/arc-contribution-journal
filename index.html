<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc Contribution Journal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Arc Contribution Journal</h1>
        <p>Track contributions, proof links, and wallet activity.</p>
      </div>
      <div class="hero-actions">
        <button id="importBtn" type="button">Import JSON</button>
        <button id="exportBtn" type="button">Export JSON</button>
        <button id="exportCsvBtn" type="button">Export CSV</button>
        <input id="importInput" type="file" accept="application/json" hidden />
      </div>
    </header>

    <section class="card">
      <form id="entryForm" class="form">
        <input type="hidden" id="editId" />

        <div class="grid">
          <label>
            Date
            <input type="date" id="date" required />
          </label>

          <label>
            Category
            <select id="category" required>
              <option value="forum">Forum</option>
              <option value="github">GitHub</option>
              <option value="community">Community</option>
              <option value="event">Event</option>
              <option value="other">Other</option>
            </select>
          </label>
        </div>

        <div class="grid">
          <label>
            Action
            <select id="action" required>
              <option value="wallet setup">wallet setup</option>
              <option value="faucet">faucet</option>
              <option value="transfer">transfer</option>
              <option value="return transfer">return transfer</option>
              <option value="explorer verification">explorer verification</option>
            </select>
          </label>

          <label>
            Status
            <select id="status" required>
              <option value="completed">completed</option>
              <option value="pending">pending</option>
              <option value="failed">failed</option>
            </select>
          </label>
        </div>

        <div class="grid">
          <label>
            Network
            <input type="text" id="network" value="Arc Testnet" required />
          </label>

          <label>
            Tx Hash
            <input type="text" id="txHash" placeholder="0x..." />
          </label>
        </div>

        <label>
          Wallet
          <input type="text" id="wallet" placeholder="0x..." required />
        </label>

        <label>
          Notes
          <textarea id="details" rows="4" placeholder="Describe your contribution" required></textarea>
        </label>

        <label>
          Proof URL
          <input type="url" id="proof" placeholder="https://..." />
        </label>

        <div class="hero-actions">
          <button id="submitBtn" type="submit">Add Entry</button>
          <button id="cancelEditBtn" type="button" hidden>Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="stats">
      <div class="card stat">
        <span>Total Entries</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="card stat">
        <span>This Week</span>
        <strong id="weekCount">0</strong>
      </div>
      <div class="card stat">
        <span>Main Category</span>
        <strong id="topCategory">-</strong>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Entries</h2>
        <div class="hero-actions">
          <select id="filterCategory">
            <option value="all">All categories</option>
            <option value="forum">Forum</option>
            <option value="github">GitHub</option>
            <option value="community">Community</option>
            <option value="event">Event</option>
            <option value="other">Other</option>
          </select>

          <select id="filterStatus">
            <option value="all">All status</option>
            <option value="completed">completed</option>
            <option value="pending">pending</option>
            <option value="failed">failed</option>
          </select>

          <select id="filterNetwork">
            <option value="all">All networks</option>
          </select>
        </div>
      </div>
      <div id="entries" class="entries"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
