
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc Contribution Journal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Arc Contribution Journal</h1>
        <p>Track wallets, proofs, and report-ready activity logs.</p>
      </div>

      <div class="hero-actions compact-actions">
        <button id="importBtn" type="button" class="secondary-action">Import JSON</button>
        <button id="exportBtn" type="button" class="secondary-action">Export JSON</button>
        <button id="exportCsvBtn" type="button" class="secondary-action">Export CSV</button>
        <button id="exportReportBtn" type="button" class="primary-action">Export Report MD</button>
        <input id="importInput" type="file" accept="application/json" hidden />
      </div>
    </header>

    
    <section class="card">
      <div class="toolbar">
        <h2>Workspaces</h2>
      </div>

      <form id="workspaceForm" class="workspace-row">
        <select id="workspaceSelect"></select>
        <input id="newWorkspaceName" type="text" placeholder="New workspace name" />
        <button id="addWorkspaceBtn" type="submit">Add Workspace</button>
        <button id="deleteWorkspaceBtn" type="button" class="danger-ghost">Delete Workspace</button>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Import From Wallet</h2>
      </div>

      <form id="walletImportForm" class="form">
        <div class="grid">
          <label>
            Wallet Address
            <input id="walletImportAddress" type="text" placeholder="0x..." required />
          </label>

          <label>
            Limit
            <select id="walletImportLimit">
              <option value="10">10 transactions</option>
              <option value="20" selected>20 transactions</option>
              <option value="50">50 transactions</option>
            </select>
          </label>
        </div>

        <div class="hero-actions">
          <button id="fetchWalletBtn" type="submit">Load Transactions</button>
          <button id="saveImportedBtn" type="button" class="secondary-action" disabled>Save Selected</button>
        </div>
      </form>

      <p id="importStatus" class="muted import-status"></p>
      <div id="importResults" class="entries"></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Address Book</h2>
      </div>

      <form id="addressForm" class="form">
        <input type="hidden" id="addressEditId" />

        <div class="grid">
          <label>
            Label
            <input type="text" id="addressLabel" placeholder="Main Wallet" required />
          </label>

          <label>
            Address
            <input type="text" id="addressValue" placeholder="0x..." required />
          </label>
        </div>

        <div class="grid">
          <label>
            Network
            <input type="text" id="addressNetwork" value="Arc Testnet" required />
          </label>

          <label>
            Notes
            <input type="text" id="addressNotes" placeholder="Optional note" />
          </label>
        </div>

        <div class="hero-actions">
          <button id="saveAddressBtn" type="submit">Add Address</button>
          <button id="cancelAddressEditBtn" type="button" hidden>Cancel Edit</button>
        </div>
      </form>

      <div id="addressList" class="entries"></div>
    </section>

    <section class="card">
      <form id="entryForm" class="form">
        <input type="hidden" id="editId" />

        <div class="grid">
          <label>
            Saved Wallet
            <select id="savedWallet">
              <option value="">Select saved wallet</option>
            </select>
          </label>

          <label>
            Date
            <input type="date" id="date" required />
          </label>
        </div>

        <div class="grid">
          <label>
            Category
            <select id="category" required>
              <option value="forum">Forum</option>
              <option value="github">GitHub</option>
              <option value="community">Community</option>
              <option value="event">Event</option>
              <option value="other">Other</option>
            </select>
          </label>

          <label>
            Action
            <select id="action" required>
              <option value="wallet setup">wallet setup</option>
              <option value="faucet">faucet</option>
              <option value="transfer">transfer</option>
              <option value="transfer in">transfer in</option>
              <option value="transfer out">transfer out</option>
              <option value="return transfer">return transfer</option>
              <option value="contract interaction">contract interaction</option>
              <option value="contract creation">contract creation</option>
              <option value="explorer verification">explorer verification</option>
              <option value="validation">validation</option>
            </select>
          </label>
        </div>

        <div class="grid">
          <label>
            Status
            <select id="status" required>
              <option value="completed">completed</option>
              <option value="pending">pending</option>
              <option value="failed">failed</option>
            </select>
          </label>

          <label>
            Network
            <input type="text" id="network" value="Arc Testnet" required />
          </label>
        </div>

        <div class="grid">
          <label>
            Tx Hash
            <input type="text" id="txHash" placeholder="0x..." />
          </label>

          <label>
            Wallet
            <input type="text" id="wallet" placeholder="0x..." required />
          </label>
        </div>

        <label>
          Notes
          <textarea id="details" rows="4" placeholder="Describe the activity" required></textarea>
        </label>

        <label>
          Proof URL
          <input type="url" id="proof" placeholder="https://..." />
        </label>

        <div class="hero-actions">
          <button id="submitBtn" type="submit">Add Entry</button>
          <button id="cancelEditBtn" type="button" hidden>Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="stats">
      <div class="card stat">
        <span>Total Entries</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="card stat">
        <span>This Week</span>
        <strong id="weekCount">0</strong>
      </div>
      <div class="card stat">
        <span>Main Category</span>
        <strong id="topCategory">-</strong>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Entries</h2>

        <div class="hero-actions">
          <select id="filterCategory">
            <option value="all">All categories</option>
            <option value="forum">Forum</option>
            <option value="github">GitHub</option>
            <option value="community">Community</option>
            <option value="event">Event</option>
            <option value="other">Other</option>
          </select>

          <select id="filterStatus">
            <option value="all">All status</option>
            <option value="completed">completed</option>
            <option value="pending">pending</option>
            <option value="failed">failed</option>
          </select>

          <select id="filterNetwork">
            <option value="all">All networks</option>
          </select>
        </div>
      </div>

      <div class="toolbar toolbar-tight">
        <p class="muted">Selected for report: <strong id="selectedCount">0</strong></p>
      </div>

      <div id="entries" class="entries"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
